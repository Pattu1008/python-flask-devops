events {}

http {
    # Prometheus
    server {
        listen 9090;

        location / {
            proxy_pass http://devops-lab-control-plane:30091;
        }
    }

    # Grafana
    server {
        listen 3000;

        location / {
            proxy_pass http://devops-lab-control-plane:30030;
        }
    }

    # Flask application
    server {
        listen 5000;

        location / {
            proxy_pass http://devops-lab-control-plane:30080;
        }
    }
}