
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Prometheus
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Flask application metrics
      - job_name: "flask-app"
        metrics_path: /metrics
        static_configs:
          - targets: ["flask-service.devops-project.svc.cluster.local:5000"]

      # Flask application health check
      - job_name: "flask-app-blackbox"
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://flask-service.devops-project.svc.cluster.local:5000/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

      # Node Exporter metrics
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - "node-exporter.monitoring.svc.cluster.local:9100"

      # Kubernetes node and pod information
      - job_name: "kube-state-metrics"
        static_configs:
          - targets:
              - "kube-state-metrics.monitoring.svc.cluster.local:8080"
