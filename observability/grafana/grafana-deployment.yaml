
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-loki-datasource
              mountPath: /etc/grafana/provisioning/datasources/loki.yaml
              subPath: loki-datasource.yaml
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-loki-datasource
          configMap:
            name: grafana-loki-datasource
            items:
              - key: loki-datasource.yaml
                path: loki-datasource.yaml
