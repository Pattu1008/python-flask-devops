
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-proxy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-proxy
  template:
    metadata:
      labels:
        app: monitoring-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: prometheus
              containerPort: 9090
            - name: grafana
              containerPort: 3000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: monitoring-proxy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-proxy-config
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 9090;
      location / {
        proxy_pass http://prometheus-service.monitoring.svc.cluster.local:9090;
      }
    }

    server {
      listen 3000;
      location / {
        proxy_pass http://grafana-service.monitoring.svc.cluster.local:3000;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-proxy-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: monitoring-proxy
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
      nodePort: 30090
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30030
