apiVersion: v1
kind: Service
metadata:
  name: monitoring-proxy-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: monitoring-proxy
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
      nodePort: 30091
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30031